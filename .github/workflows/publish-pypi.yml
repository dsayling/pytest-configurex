name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - get version without publishing or creating tag'
        required: true
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: ${{ inputs.dry_run }}
          default_bump: false
          release_branches: main
          tag_prefix: v

      - name: Display version
        run: |
          echo "Version: ${{ steps.tag_version.outputs.new_tag }}"
          echo "Version without v prefix: ${{ steps.tag_version.outputs.new_version }}"

      - uses: actions/setup-python@v5
        if: ${{ !inputs.dry_run }}
        with:
          python-version: '3.10'

      - name: Install build dependencies
        if: ${{ !inputs.dry_run }}
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        if: ${{ !inputs.dry_run }}
        run: python -m build

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
