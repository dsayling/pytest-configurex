[build-system]
requires = [
  "setuptools>=61.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-configurex"
description = "a simple envvar way of managing pytest execution"
version = "0.0.1"
readme = "README.rst"
requires-python = ">=3.8"
authors = [
    { name = "Drew Ayling", email = "drew@ayling.fyi" },
]
maintainers = [
    { name = "Drew Ayling", email = "drew@ayling.fyi" },
]
license = {file = "LICENSE"}
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pytest>=8.4.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
[project.urls]
Repository = "https://github.com/dsayling/pytest-configurex"
[project.entry-points.pytest11]
configurex = "pytest_configurex.plugin"
