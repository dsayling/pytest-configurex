name: Test Matrix (Multiple Environments)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        test-type: [unit, integration]
        exclude:
          # Skip integration tests on Windows (example)
          - os: windows-latest
            test-type: integration

    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.test-type }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ${{ matrix.test-type }} tests
        run: |
          # Use CLI args for explicit control (faster than file copy)
          if [ "${{ matrix.test-type }}" == "unit" ]; then
            uv run pytest \
              --configurex-verbosity=1 \
              --configurex-markers="unit and not slow" \
              --configurex-coverage \
              --configurex-coverage-report=xml \
              --configurex-xdist-n=auto
          else
            uv run pytest \
              --configurex-verbosity=1 \
              --configurex-markers="integration" \
              --configurex-coverage \
              --configurex-coverage-report=xml
          fi
        shell: bash

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: ${{ matrix.test-type }}-${{ matrix.os }}-py${{ matrix.python-version }}
