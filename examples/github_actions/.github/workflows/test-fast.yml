name: Fast Tests (Unit Only)

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: |
          # Configure via environment variables (fastest)
          export X_VERBOSITY=1
          export X_COVERAGE_ENABLED=true
          export X_COVERAGE_SOURCE=src
          export X_COVERAGE_REPORT=xml
          export X_XDIST_NUMPROCESSES=auto
          # Run all tests (or specify a directory like tests/unit/)
          uv run pytest

          # To filter by markers, ensure tests are marked first:
          # export X_MARKERS="unit and not slow"
          # Then run: uv run pytest

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unit-tests
          name: python-${{ matrix.python-version }}
