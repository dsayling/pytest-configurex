name: Full Test Suite

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test-all:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: |
          # Option 1: Use .env files (if they exist in your repo)
          # cp .env.pytest.unit .env.pytest
          # uv run pytest

          # Option 2: Use environment variables (recommended for CI)
          export X_VERBOSITY=1
          export X_COVERAGE_ENABLED=true
          export X_COVERAGE_REPORT=xml
          export X_XDIST_NUMPROCESSES=auto
          uv run pytest tests/unit/

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
        run: |
          export X_VERBOSITY=1
          export X_COVERAGE_ENABLED=true
          export X_COVERAGE_REPORT=xml
          uv run pytest tests/integration/

      - name: Run E2E tests
        run: |
          export X_VERBOSITY=1
          export X_LOG_FILE=e2e.log
          uv run pytest tests/e2e/

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: full-suite
